<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secteurs d'activité · Salons &amp; Foires</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT: '#c2410c', dark: '#9a3412' },
          nav: '#14213d',
        },
      },
    },
  };
</script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen">

<header class="bg-nav text-white px-4 sm:px-8 py-3 flex items-center justify-between">
  <span class="font-bold tracking-wide">Salons &amp; Foires</span>
  <nav>
    <span class="px-3 py-1 rounded-md bg-white/10">Secteurs d'activité</span>
  </nav>
</header>

<main class="max-w-4xl mx-auto px-4 sm:px-8 py-8">

  <div id="alert-box" class="hidden mb-4 rounded-lg border px-4 py-3 text-sm"></div>

  <div class="flex flex-wrap items-start justify-between gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-bold">Secteurs d'activité</h1>
      <p id="count-label" class="text-slate-500 text-sm mt-1">Chargement…</p>
    </div>
    <button id="btn-add" type="button"
      class="inline-flex items-center rounded-lg bg-brand hover:bg-brand-dark text-white font-semibold px-4 py-2 transition">
      + Ajouter un secteur
    </button>
  </div>

  <div class="bg-white border border-slate-200 rounded-lg overflow-x-auto">
    <table class="w-full text-left border-collapse min-w-[560px]">
      <thead>
        <tr class="text-xs font-semibold text-slate-500 bg-slate-50">
          <th class="px-4 py-3">Nom</th>
          <th class="px-4 py-3">Description</th>
          <th class="px-4 py-3 text-right">Actions</th>
        </tr>
      </thead>
      <tbody id="table-body" class="divide-y divide-slate-200">
        <tr><td colspan="3" class="px-4 py-8 text-center text-slate-400">Chargement des secteurs…</td></tr>
      </tbody>
    </table>
  </div>

  <div id="empty-state" class="hidden text-center bg-white border border-slate-200 rounded-lg py-14 px-6 mt-4">
    <h2 class="font-semibold text-lg mb-1">Aucun secteur d'activité</h2>
    <p class="text-slate-500 mb-4">Ajoutez votre premier secteur pour commencer.</p>
    <button type="button" class="btn-add-empty inline-flex items-center rounded-lg bg-brand hover:bg-brand-dark text-white font-semibold px-4 py-2 transition">
      + Ajouter un secteur
    </button>
  </div>

</main>

<!-- Modale Ajouter / Modifier -->
<div id="form-modal" class="hidden fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-40">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
    <h2 id="form-title" class="text-lg font-bold mb-4">Ajouter un secteur</h2>
    <form id="secteur-form" novalidate>
      <input type="hidden" id="secteur-id" value="">

      <div class="mb-4">
        <label for="nom" class="block text-sm font-semibold mb-1">Nom</label>
        <input id="nom" name="nom" type="text" maxlength="100" required
          class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand">
        <p id="error-nom" class="hidden text-red-600 text-sm mt-1"></p>
      </div>

      <div class="mb-6">
        <label for="description" class="block text-sm font-semibold mb-1">Description</label>
        <textarea id="description" name="description" rows="4" maxlength="500"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand"></textarea>
        <p id="error-description" class="hidden text-red-600 text-sm mt-1"></p>
      </div>

      <div class="flex justify-end gap-2">
        <button type="button" id="btn-cancel"
          class="rounded-lg px-4 py-2 font-semibold text-slate-600 hover:bg-slate-100 transition">Annuler</button>
        <button type="submit" id="btn-submit"
          class="rounded-lg bg-brand hover:bg-brand-dark text-white font-semibold px-4 py-2 transition">Ajouter</button>
      </div>
    </form>
  </div>
</div>

<!-- Modale Détails -->
<div id="details-modal" class="hidden fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-40">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
    <h2 id="details-nom" class="text-lg font-bold mb-1"></h2>
    <p id="details-id" class="text-slate-400 text-xs mb-4"></p>
    <p class="text-sm font-semibold text-slate-500 mb-1">Description</p>
    <p id="details-description" class="text-slate-700 mb-6"></p>
    <div class="flex justify-end">
      <button type="button" id="btn-close-details"
        class="rounded-lg px-4 py-2 font-semibold text-slate-600 hover:bg-slate-100 transition">Fermer</button>
    </div>
  </div>
</div>

<!-- Modale Confirmation suppression -->
<div id="confirm-modal" class="hidden fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-40">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-sm p-6">
    <h2 class="text-lg font-bold mb-2">Supprimer ce secteur ?</h2>
    <p class="text-slate-500 text-sm mb-6">Cette action est irréversible.</p>
    <div class="flex justify-end gap-2">
      <button type="button" id="btn-cancel-delete"
        class="rounded-lg px-4 py-2 font-semibold text-slate-600 hover:bg-slate-100 transition">Annuler</button>
      <button type="button" id="btn-confirm-delete"
        class="rounded-lg bg-red-600 hover:bg-red-700 text-white font-semibold px-4 py-2 transition">Supprimer</button>
    </div>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
